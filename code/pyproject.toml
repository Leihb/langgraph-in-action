[project]
name = "langgraph-in-action"
version = "0.1.0"
description = "《LangGraph in Action》各期可运行代码"
requires-python = ">=3.11"
dependencies = [
    "langgraph==1.2.11",
    "langchain==1.3.18",
    "langchain-openai>=1.0",
    "langgraph-checkpoint-sqlite==3.1.1",
    "langgraph-checkpoint-postgres==3.1.2",
    "langfuse>=3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "langchain-mcp-adapters>=0.3.2",
    "pyyaml>=6.0.3",
    "aiosqlite>=0.22.1",
    "sentence-transformers>=6.0.1",
    "numpy>=2.4.6",
    "psycopg[binary,pool]>=3.3.5",
]

[project.optional-dependencies]
# 只有第 12 期用到。deepagents 硬依赖 langchain-anthropic 和 langchain-google-genai，单独一组。
deepagents = ["deepagents==0.7.12"]

[tool.uv]
package = false
